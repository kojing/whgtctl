<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>whgtctl 光学補正</title>
<style>
  :root { --bg:#2b2b2b; --fg:#e6e6e6; --sub:#a8a8a8; --line:#444; --acc:#4b8df8; }
  * { box-sizing:border-box; }
  body { margin:0; padding:10px 12px 16px; background:var(--bg); color:var(--fg); font:12px/1.4 -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  h2 { font-size:11px; font-weight:600; color:var(--sub); margin:14px 0 6px; letter-spacing:.04em; }
  .row { display:grid; grid-template-columns:1fr 46px; gap:4px 8px; align-items:center; margin:4px 0; }
  .row label { grid-column:1 / 3; color:var(--fg); }
  .row input[type=range] { width:100%; }
  .row input[type=number] { width:46px; background:#1e1e1e; color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:1px 3px; font:inherit; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; }
  button { background:#3a3a3a; color:var(--fg); border:1px solid #555; border-radius:4px; padding:5px 10px; font:inherit; cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  .presets button { padding:3px 6px; font-size:11px; }
  select, input[type=text] { background:#1e1e1e; color:var(--fg); border:1px solid var(--line); border-radius:3px; padding:2px 4px; font:inherit; }
  .chk { display:flex; gap:6px; align-items:center; margin:4px 0; }
  .grid2 { display:grid; grid-template-columns:auto 1fr; gap:4px 8px; align-items:center; }
  #info { color:var(--sub); min-height:2.8em; margin:6px 0; }
  #status { color:#9fd39f; min-height:1.4em; }
  #status.err { color:#ff8f8f; }
  hr { border:0; border-top:1px solid var(--line); margin:10px 0; }
</style>
</head>
<body>
  <div id="boot" style="color:#ffd27f;margin-bottom:6px">パネルの画面を読み込みました（この行が消えない場合は、スクリプトの読み込みに失敗しています）</div>
  <div class="btns">
    <button id="bLoad" class="primary">選択を読み込む</button>
    <button id="bApply">適用（確定）</button>
    <button id="bCancel">元に戻す</button>
  </div>
  <div id="info">文字（グループ）を選択して「選択を読み込む」</div>
  <div id="status"></div>
  <div class="chk"><input type="checkbox" id="cbPrev" checked><label for="cbPrev">プレビュー</label></div>

  <h2>書体とメトリクス（ドキュメント座標・pt）</h2>
  <div class="grid2">
    <span>書体</span><select id="script"><option value="latin">欧文</option><option value="kana">かな（ひらがな・カタカナ）</option><option value="symj">和文記号</option><option value="syml">欧文記号</option></select>
    <span>ベースライン</span><input type="text" id="base" size="8">
    <span>上端</span><input type="text" id="top" size="8">
    <span>頂点数</span><select id="pts"><option value="opt">ウェイト間で揃える＋区間を整理</option><option value="fine">ウェイト間で揃える（元の区間）</option><option value="same">元と同じ</option><option value="free">揃えない（最高精度）</option></select>
  </div>
  <div class="chk"><input type="checkbox" id="cbLock"><label for="cbLock">ベースラインと上端に乗る水平の辺を動かさない</label></div>

  <div id="sliders"></div>
  <div class="chk"><input type="checkbox" id="cbSnap"><label for="cbSnap">線端を水平・垂直に揃える</label></div>
  <hr>
  <div class="btns"><button id="bReset">値をリセット</button></div>

<script src="js/engine.js"></script>
<script src="js/panel.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
